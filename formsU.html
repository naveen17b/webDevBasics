<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h2> Login Form </h2>

    <form>
        <label for="email">
            Email:
            <input type="email" name="email" placeholder="Enter your Email ID">
        </label>

        <label for="Password">
            Password:
            <input type="password" name="password" placeholder="Enter your Password">
        </label>
        <button type="submit">Login</button>
        <button type="reset">Reset</button>
    </form>

    <div>
        <h3> Favourite Sports: </h3>

        <form>
            <label for="sports">
                Football: <input type="checkbox" name="sports" id="sports1" value="Football">
            </label>

            <label for="sports">
                Cricket: <input type="checkbox" name="sports" id="sports2" value="Cricket">
            </label>

            <label for="sports">
                Swimming: <input type="checkbox" name="sports" id="sports1" value="Swimming">
            </label>

            <label for="sports">
                Basketball: <input type="checkbox" name="sports" id="sports2" value="Basketball">
            </label>
        </form>


    </div>


    <div>

        <h3> Favorite courses: </h4>
            <label for="sports">
                <select name="Courses" id="">
                    <option value="Data Science">Data Science</option>
                    <option value="CA">Charted Accountant</option>
                    <option value="Software Development">Software Development</option>
                    <option value="Python">Python</option>
                </select>

                <button type="submit"> Submit </button>
            </label>
        </h4>
    </div>

</body>

</html>
